version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gold_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-gold_yahoo_finance}
      MYSQL_USER: ${DB_USER:-gold_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gold_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./storage/schema_mysql.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gold_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: gold_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-root_password}
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gold_network

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gold_airflow_init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+pymysql://root:${DB_PASSWORD:-root_password}@mysql:3306/airflow_db
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    entrypoint: >
      bash -c "
        airflow db init &&
        airflow users create --username airflow --password airflow --firstname Admin --lastname User --role Admin --email admin@example.com || true
      "
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gold_network

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gold_airflow_webserver
    restart: always
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+pymysql://root:${DB_PASSWORD:-root_password}@mysql:3306/airflow_db
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root_password}
      DB_NAME: ${DB_NAME:-gold_yahoo_finance}
    ports:
      - "8081:8080"
    command: airflow webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./fetcher:/opt/airflow/fetcher
      - ./analysis:/opt/airflow/analysis
      - ./storage:/opt/airflow/storage
    networks:
      - gold_network

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gold_airflow_scheduler
    restart: always
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+pymysql://root:${DB_PASSWORD:-root_password}@mysql:3306/airflow_db
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root_password}
      DB_NAME: ${DB_NAME:-gold_yahoo_finance}
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./fetcher:/opt/airflow/fetcher
      - ./analysis:/opt/airflow/analysis
      - ./storage:/opt/airflow/storage
    networks:
      - gold_network

volumes:
  mysql_data:
    driver: local

networks:
  gold_network:
    driver: bridge
