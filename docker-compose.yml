version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gold_mysql_active
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-gold_yahoo_finance_active}
      MYSQL_USER: ${DB_USER:-gold_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gold_password}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./storage/schema_raw.sql:/docker-entrypoint-initdb.d/01_schema_raw.sql
      - ./storage/schema_curated.sql:/docker-entrypoint-initdb.d/02_schema_curated.sql
      - ./storage/schema_mart.sql:/docker-entrypoint-initdb.d/03_schema_mart.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gold_network_active

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: gold_phpmyadmin_active
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-root_password}
    ports:
      - "8084:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gold_network_active

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gold_airflow_init_active
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+pymysql://root:${DB_PASSWORD:-root_password}@mysql:3306/airflow_db
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    entrypoint: >
      bash -c "
        airflow db init &&
        airflow users create --username airflow --password airflow --firstname Admin --lastname User --role Admin --email admin@example.com || true
      "
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gold_network_active

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gold_airflow_webserver_active
    restart: always
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+pymysql://root:${DB_PASSWORD:-root_password}@mysql:3306/airflow_db
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root_password}
      DB_NAME: ${DB_NAME:-gold_yahoo_finance_active}
    ports:
      - "8085:8080"
    command: airflow webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./fetcher:/opt/airflow/fetcher
      - ./analysis:/opt/airflow/analysis
      - ./storage:/opt/airflow/storage
      - ./scripts:/opt/airflow/scripts
    networks:
      - gold_network_active

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gold_airflow_scheduler_active
    restart: always
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+pymysql://root:${DB_PASSWORD:-root_password}@mysql:3306/airflow_db
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root_password}
      DB_NAME: ${DB_NAME:-gold_yahoo_finance_active}
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./fetcher:/opt/airflow/fetcher
      - ./analysis:/opt/airflow/analysis
      - ./storage:/opt/airflow/storage
      - ./scripts:/opt/airflow/scripts
    networks:
      - gold_network_active

volumes:
  mysql_data:
    driver: local

networks:
  gold_network_active:
    driver: bridge
